<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t d">
<title id="t">Organic matter in the early Solar System</title>
<desc id="d">A young star surrounded by a dusty protoplanetary disk where organic matter formed, with a dark, carbon-rich asteroid in the foreground that preserved this organic matter and delivers it to Earth as meteorites.</desc>
<defs>
  <radialGradient id="space" cx=".3" cy=".5" r=".9">
    <stop offset="0" stop-color="#1d2440"/><stop offset="1" stop-color="#05070f"/>
  </radialGradient>
  <radialGradient id="star" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#ffffff"/><stop offset=".12" stop-color="#fff4d0"/><stop offset=".4" stop-color="#ffcf7a" stop-opacity=".45"/><stop offset="1" stop-color="#ff9a3c" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="disk" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#ffe2a8" stop-opacity=".9"/><stop offset=".35" stop-color="#d69a5c" stop-opacity=".55"/><stop offset=".7" stop-color="#8a5a3c" stop-opacity=".35"/><stop offset="1" stop-color="#4a3040" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="rockgrad" cx=".3" cy=".35" r=".85">
    <stop offset="0" stop-color="#4f4841"/><stop offset=".55" stop-color="#2c2824"/><stop offset="1" stop-color="#110f0c"/>
  </radialGradient>
  <radialGradient id="shade" cx=".22" cy=".4" r=".95">
    <stop offset=".25" stop-color="#000" stop-opacity="0"/><stop offset=".7" stop-color="#000" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity=".9"/>
  </radialGradient>
  <filter id="b2"><feGaussianBlur stdDeviation="2"/></filter>
  <filter id="b6"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="nebula" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".006 .01" numOctaves="4" seed="11" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 .35  0 0 0 0 .3  0 0 0 0 .6  0 0 0 1.6 -.75"/>
  </filter>
  <filter id="dust" x="-10%" y="-30%" width="120%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency=".03 .12" numOctaves="3" seed="4" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="18" result="d"/>
    <feGaussianBlur in="d" stdDeviation="1.5"/>
  </filter>
  <filter id="rocky" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency=".045" numOctaves="5" seed="3" result="n"/>
    <feDiffuseLighting in="n" lighting-color="#ffffff" surfaceScale="4" result="l"><feDistantLight azimuth="210" elevation="38"/></feDiffuseLighting>
    <feComposite in="l" in2="SourceGraphic" operator="in" result="lit"/>
    <feBlend in="SourceGraphic" in2="lit" mode="multiply"/>
  </filter>
</defs>
<rect width="800" height="500" fill="url(#space)"/>
<rect width="800" height="500" filter="url(#nebula)" opacity=".7"/>
