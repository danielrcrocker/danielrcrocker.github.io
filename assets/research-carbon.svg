<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t d">
<title id="t">Organic matter in soils and surface waters</title>
<desc id="d">Cross-section of a sunlit lakeshore: organic-rich soil layers with roots on the left feed tea-colored dissolved organic matter into the water, where shafts of sunlight penetrate and drive photochemical oxidation.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#6f9fc4"/><stop offset="1" stop-color="#e6eef0"/>
  </linearGradient>
  <radialGradient id="sunglow" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#fffbe8"/><stop offset=".3" stop-color="#fff0b8" stop-opacity=".85"/><stop offset="1" stop-color="#ffe29a" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8a6a3c"/><stop offset=".35" stop-color="#5e4a2c"/><stop offset="1" stop-color="#2a2518"/>
  </linearGradient>
  <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3a2a1c"/><stop offset=".35" stop-color="#5a4028"/><stop offset=".7" stop-color="#7a5a3a"/><stop offset="1" stop-color="#8e7050"/>
  </linearGradient>
  <linearGradient id="shaft" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff2c4" stop-opacity=".55"/><stop offset="1" stop-color="#fff2c4" stop-opacity="0"/>
  </linearGradient>
  <filter id="b4"><feGaussianBlur stdDeviation="4"/></filter>
  <filter id="b10"><feGaussianBlur stdDeviation="10"/></filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="2" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0" result="g"/>
    <feComponentTransfer in="g" result="g2"><feFuncA type="linear" slope=".35"/></feComponentTransfer>
    <feComposite in="g2" in2="SourceGraphic" operator="in" result="t"/>
    <feBlend in="SourceGraphic" in2="t" mode="multiply"/>
  </filter>
  <filter id="swirl" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency=".012 .04" numOctaves="3" seed="5" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="40"/>
    <feGaussianBlur stdDeviation="3"/>
  </filter>
  <clipPath id="waterclip"><path d="M300 312 L800 312 L800 500 L300 500 Z"/></clipPath>
</defs>
<rect width="800" height="500" fill="url(#sky)"/>
<circle cx="560" cy="80" r="130" fill="url(#sunglow)"/>
<circle cx="560" cy="80" r="20" fill="#fffdf3"/>
<!-- far shore -->
<path d="M300 300 C 420 282, 520 290, 620 284 S 760 286, 800 290 L800 314 L300 314 Z" fill="#5d7a4e" opacity=".85"/>
<g fill="#3f5b36" opacity=".9">
